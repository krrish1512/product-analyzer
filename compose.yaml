services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pricewise
      POSTGRES_USER: pricewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    ports:
      - "5432:5432"
    volumes:
      - pricewise_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewise -d pricewise"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 0
      DATABASE_URL: postgresql://pricewise:${POSTGRES_PASSWORD:-local-only-password}@db:5432/pricewise
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pricewise_data:
